name: krishi
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  http: ^1.3.0
  camera: ^0.11.1
  flutter_launcher_icons: ^0.14.3
  flutter_markdown: ^0.7.6+2
  flutter_dotenv: ^5.2.1
  intl: ^0.19.0
  geolocator: ^13.0.3
  path_provider: ^2.1.5
  carousel_slider: ^5.0.0
  image_picker: ^1.1.2
  shared_preferences: ^2.5.2
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  google_sign_in: ^6.2.1
  fl_chart: ^0.70.2
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  flutter_facebook_auth: ^7.1.1
  pinput: ^5.0.1
  google_maps_flutter: ^2.12.0
  google_maps_widget: ^1.0.6
  map: ^2.0.2
  cached_network_image: ^3.4.1
  latlng: ^2.0.7
  get: ^4.7.2
  geocoding: ^3.0.0
  google_fonts: ^6.2.1
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  generate: true # ✅ Important for localization generation

  fonts:
    - family: krishi-font
      fonts:
        - asset: assets/fonts/Fraunces-Variab.ttf        
        - asset: assets/fonts/Fraunces-Italic.ttf
          weight: 700

    - family: Pokemon
      fonts:
        - asset: assets/fonts/Pokemon Hollow.ttf
        - asset: assets/fonts/Pokemon Solid.ttf
          weight: 700

  assets:
    - .env
    - assets/
    - assets/images/
    - assets/icons/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/krishi_pool.jpg"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/krishi_logo.png"
